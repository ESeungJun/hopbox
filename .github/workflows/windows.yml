name: windows

# 윈도우판을 시험하고, x64·arm64 실행 파일과 설치 파일을 만든다.
# 윈도우 코드가 바뀐 push 마다 돌고, v* 태그를 올리면 같은 이름의 릴리스에 파일을 붙인다(릴리스가 없으면 초안으로 만든다).
# 쓰기 권한은 태그일 때 릴리스에 붙이는 일에만 준다. 외부 액션은 커밋 해시로 고정한다.
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['windows/**', '.github/workflows/windows.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x

      - name: 버전 정하기
        shell: pwsh
        run: |
          # 태그면 태그 버전, 아니면 시험용 0.0.0
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          "HOPBOX_VERSION=$version" >> $env:GITHUB_ENV

      - name: 시험
        run: dotnet test windows/Hopbox.Windows.Tests -c Release

      - name: 실행 파일 만들기
        shell: pwsh
        run: |
          foreach ($arch in 'x64', 'arm64') {
            dotnet publish windows/Hopbox.Windows -c Release -r "win-$arch" --self-contained true `
              "-p:Version=$env:HOPBOX_VERSION" -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
              -o "out/$arch"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: 켜서 상자 부르기 (바로 꺼지지 않는지)
        shell: pwsh
        run: |
          # 부채꼴까지 그려 보도록 담긴 항목을 미리 넣어 둔다
          $data = Join-Path $env:APPDATA Hopbox
          New-Item -ItemType Directory -Force $data | Out-Null
          Copy-Item docs/images/icon.png "$env:USERPROFILE\Documents\hopbox-smoke.png"
          $items = @(
            @{ Id = [guid]::NewGuid(); Kind = 'Text'; Text = '시험 문장'; Preview = '시험 문장'; TextLength = 5; AddedAt = (Get-Date).ToString('o') },
            @{ Id = [guid]::NewGuid(); Kind = 'File'; Path = "$env:USERPROFILE\Documents\hopbox-smoke.png"; AddedAt = (Get-Date).ToString('o') }
          )
          ConvertTo-Json $items | Set-Content -Encoding utf8 (Join-Path $data items.json)
          $app = Start-Process out/x64/Hopbox.exe -PassThru
          Start-Sleep -Seconds 6
          if ($app.HasExited) { Write-Error "켜자마자 꺼졌어요 (종료 코드 $($app.ExitCode))"; exit 1 }
          # 두 번째로 실행하면 이미 켜진 앱이 상자를 부르고, 담긴 게 있으면 부채꼴을 연다
          Start-Process out/x64/Hopbox.exe -Wait
          Start-Sleep -Seconds 3
          if ($app.HasExited) { Write-Error "상자를 부르다 꺼졌어요 (종료 코드 $($app.ExitCode))"; exit 1 }
          Stop-Process -Id $app.Id -Force
          $log = Join-Path $data error.log
          if (Test-Path $log) { Get-Content $log; Write-Error "오류가 기록됐어요"; exit 1 }
          if ((Get-Content (Join-Path $data items.json) | ConvertFrom-Json).Count -ne 2) { Write-Error "담긴 항목을 읽지 못했어요"; exit 1 }

      - name: 설치 파일 만들기
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $candidate = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $candidate)) { choco install innosetup --version 6.7.1 -y --no-progress | Out-Null }
            $iscc = $candidate
          } else { $iscc = $iscc.Source }
          $version = $env:HOPBOX_VERSION
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($arch in 'x64', 'arm64') {
            & $iscc "/DArch=$arch" "/DSource=$PWD\out\$arch" "/DAppVersion=$version" "/DOutput=$PWD\dist" windows/installer/hopbox.iss
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: hopbox-windows
          path: dist/*.exe

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: hopbox-windows
          path: dist

      - name: 릴리스에 붙이기
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --draft --title "$TAG" --notes ""
          gh release upload "$TAG" dist/*.exe --clobber
